<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="color-scheme" content="light" />
  <title>Subject Attendance — Teacher App</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f1f5f9;
      color: #0f172a;
    }
    input, textarea, select {
      background-color: #ffffff !important;
      color: #0f172a !important;
      color-scheme: light !important;
    }
    button {
      -webkit-appearance: none;
      appearance: none;
    }
    .tab-active {
      color: #1d4ed8 !important;
      border-top: 2px solid #1d4ed8;
      background-color: #eff6ff !important;
    }
  </style>
</head>
<body class="text-slate-900 min-h-screen flex flex-col">

  <div id="app" class="max-w-md w-full mx-auto min-h-screen bg-white shadow-sm flex flex-col relative">
    <!-- Top Header -->
    <header id="app-header" class="bg-gradient-to-r from-blue-700 to-indigo-700 text-white px-3.5 py-3.5 flex items-center justify-between gap-2 sticky top-0 z-20 shadow-md">
      <div class="flex items-center gap-2 min-w-0">
        <button type="button" id="btn-header-back" class="hidden px-2.5 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-400 text-white text-xs font-semibold flex items-center gap-1 shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          <span>Back</span>
        </button>
        <div class="min-w-0">
          <h1 id="header-title" class="text-base font-bold text-white truncate">Subject Attendance</h1>
          <p id="header-subtitle" class="text-xs text-blue-100 truncate">Select a subject to unlock</p>
        </div>
      </div>
      <div id="header-actions" class="flex items-center gap-1.5 shrink-0"></div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-24"></main>

    <!-- Bottom Navigation (visible only when a subject is unlocked) -->
    <nav id="bottom-nav" class="hidden fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full bg-white border-t border-slate-200 grid grid-cols-3 z-20">
      <button type="button" data-tab="mark" class="nav-btn py-2.5 flex flex-col items-center gap-0.5 text-xs font-medium bg-white text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>Mark</span>
      </button>
      <button type="button" data-tab="students" class="nav-btn py-2.5 flex flex-col items-center gap-0.5 text-xs font-medium bg-white text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        <span>Students</span>
      </button>
      <button type="button" data-tab="history" class="nav-btn py-2.5 flex flex-col items-center gap-0.5 text-xs font-medium bg-white text-slate-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>

  <!-- Modal Backdrop -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-900/50 z-40 flex items-center justify-center p-4">
    <div id="modal-card" class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-20 left-1/2 -translate-x-1/2 bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg z-50 transition-opacity"></div>

  <script>
    const STORAGE_KEY = 'teacher_attendance_v2';

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function createDefaultState() {
      return {
        adminPin: '0000',
        subjects: [
          {
            id: 'sub_1',
            name: 'Mathematics',
            code: 'MATH101',
            teacher: 'Prof. Ananya Rao',
            pin: '1234',
            students: [
              { id: 'st_1', regNo: '101', name: 'Aarav Sharma' },
              { id: 'st_2', regNo: '102', name: 'Diya Patel' },
              { id: 'st_3', regNo: '103', name: 'Rohan Verma' },
              { id: 'st_4', regNo: '104', name: 'Sneha Nair' }
            ],
            sessions: {
              '2026-11-22': { st_1: 'present', st_2: 'present', st_3: 'absent', st_4: 'present' },
              '2026-11-23': { st_1: 'present', st_2: 'absent', st_3: 'absent', st_4: 'present' }
            }
          },
          {
            id: 'sub_2',
            name: 'Computer Science',
            code: 'CS102',
            teacher: 'Prof. Vikram Kulkarni',
            pin: '5678',
            students: [
              { id: 'st_5', regNo: '201', name: 'Kabir Mehta' },
              { id: 'st_6', regNo: '202', name: 'Meera Joshi' },
              { id: 'st_7', regNo: '203', name: 'Arjun Reddy' }
            ],
            sessions: {
              '2026-11-23': { st_5: 'present', st_6: 'present', st_7: 'present' }
            }
          },
          {
            id: 'sub_3',
            name: 'Physics',
            code: 'PHY103',
            teacher: 'Prof. Suresh Iyer',
            pin: '2222',
            students: [
              { id: 'st_8', regNo: '301', name: 'Neha Kulkarni' },
              { id: 'st_9', regNo: '302', name: 'Siddharth Rao' },
              { id: 'st_10', regNo: '303', name: 'Pooja Deshmukh' }
            ],
            sessions: {}
          },
          {
            id: 'sub_4',
            name: 'Chemistry',
            code: 'CHEM104',
            teacher: 'Prof. Kavita Menon',
            pin: '3333',
            students: [
              { id: 'st_11', regNo: '401', name: 'Aditya Singh' },
              { id: 'st_12', regNo: '402', name: 'Riya Gupta' }
            ],
            sessions: {}
          },
          {
            id: 'sub_5',
            name: 'English',
            code: 'ENG105',
            teacher: 'Prof. Farhan Ali',
            pin: '4444',
            students: [
              { id: 'st_13', regNo: '501', name: 'Zoya Khan' },
              { id: 'st_14', regNo: '502', name: 'Karan Malhotra' }
            ],
            sessions: {}
          }
        ]
      };
    }

    let db = loadState();
    let ui = {
      screen: 'home', // 'home' | 'subject' | 'admin'
      activeSubjectId: null,
      activeTab: 'mark', // 'mark' | 'students' | 'history'
      selectedDate: todayISO(),
      draftStatus: {},
      searchQuery: ''
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.subjects)) return parsed;
        }
      } catch (e) {}
      return createDefaultState();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function openModal(html) {
      document.getElementById('modal-card').innerHTML = html;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      document.getElementById('modal-card').innerHTML = '';
    }

    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function getActiveSubject() {
      return db.subjects.find((s) => s.id === ui.activeSubjectId) || null;
    }

    function computeStudentTotals(subject) {
      const sessionDates = Object.keys(subject.sessions || {});
      const totalDays = sessionDates.length;
      return subject.students
        .slice()
        .sort((a, b) => a.regNo.localeCompare(b.regNo, undefined, { numeric: true }))
        .map((st) => {
          let present = 0;
          let absent = 0;
          for (const dt of sessionDates) {
            const status = subject.sessions[dt][st.id];
            if (status === 'present') present++;
            else if (status === 'absent') absent++;
          }
          const pct = totalDays > 0 ? (present / totalDays) * 100 : 100;
          return { ...st, present, absent, pct };
        });
    }

    function initDraftForDate(subject, dateStr) {
      const existing = (subject.sessions && subject.sessions[dateStr]) || {};
      const draft = {};
      for (const st of subject.students) {
        draft[st.id] = existing[st.id] || 'present';
      }
      ui.draftStatus = draft;
    }

    // -----------------------------------------------------------------------
    // RENDERING
    // -----------------------------------------------------------------------
    function render() {
      const headerTitle = document.getElementById('header-title');
      const headerSub = document.getElementById('header-subtitle');
      const headerActions = document.getElementById('header-actions');
      const backBtn = document.getElementById('btn-header-back');
      const main = document.getElementById('main-content');
      const nav = document.getElementById('bottom-nav');

      backBtn.onclick = () => {
        ui.screen = 'home';
        ui.activeSubjectId = null;
        ui.searchQuery = '';
        render();
      };

      if (ui.screen === 'home') {
        backBtn.classList.add('hidden');
        nav.classList.add('hidden');
        headerTitle.textContent = 'Subject Attendance';
        headerSub.textContent = 'Select a subject & enter PIN/password';
        headerActions.innerHTML = `
          <button type="button" id="btn-admin-open" class="px-3 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-400 text-white text-xs font-semibold">
            Admin
          </button>
        `;
        document.getElementById('btn-admin-open').addEventListener('click', promptAdminPin);
        renderHome(main);
      } else if (ui.screen === 'admin') {
        backBtn.classList.remove('hidden');
        nav.classList.add('hidden');
        headerTitle.textContent = 'Admin / HOD';
        headerSub.textContent = 'Subjects, codes & passwords';
        headerActions.innerHTML = '';
        renderAdmin(main);
      } else if (ui.screen === 'subject') {
        const sub = getActiveSubject();
        if (!sub) {
          ui.screen = 'home';
          return render();
        }
        backBtn.classList.remove('hidden');
        nav.classList.remove('hidden');
        headerTitle.textContent = `${sub.name} (${sub.code})`;
        headerSub.textContent = sub.teacher;
        headerActions.innerHTML = `
          <button type="button" id="btn-edit-sub-info" class="px-2 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-400 text-white text-xs font-semibold">
            Edit
          </button>
          <button type="button" id="btn-change-sub-pin" class="px-2 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-400 text-white text-xs font-semibold">
            PIN
          </button>
          <button type="button" id="btn-export-csv" class="px-2 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-semibold">
            CSV
          </button>
        `;
        document.getElementById('btn-edit-sub-info').addEventListener('click', () => openAddSubjectModal(sub));
        document.getElementById('btn-change-sub-pin').addEventListener('click', () => openResetPinModal(sub.id));
        document.getElementById('btn-export-csv').addEventListener('click', () => exportCsv(sub));
        updateNavHighlight();
        renderSubjectDashboard(main, sub);
      }
    }

    function updateNavHighlight() {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        if (btn.dataset.tab === ui.activeTab) {
          btn.classList.add('tab-active');
          btn.classList.remove('text-slate-500');
        } else {
          btn.classList.remove('tab-active');
          btn.classList.add('text-slate-500');
        }
      });
    }

    document.querySelectorAll('.nav-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        ui.activeTab = btn.dataset.tab;
        ui.searchQuery = '';
        render();
      });
    });

    // -----------------------------------------------------------------------
    // HOME SCREEN
    // -----------------------------------------------------------------------
    function renderHome(container) {
      if (db.subjects.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center mt-10">
            <div class="w-14 h-14 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            </div>
            <h2 class="text-base font-semibold text-slate-800">No subjects yet</h2>
            <p class="text-sm text-slate-500 mt-1">Tap <strong>Admin</strong> (top right) to add subjects and teacher PINs.</p>
          </div>
        `;
        return;
      }

      const cards = db.subjects
        .map((s) => {
          const days = Object.keys(s.sessions || {}).length;
          return `
            <button type="button" data-sub-id="${escapeHtml(s.id)}" class="sub-card w-full text-left p-4 rounded-xl border border-slate-200 bg-white hover:border-blue-400 hover:bg-blue-50/40 transition flex items-center justify-between gap-3 shadow-xs">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 text-[11px] font-semibold rounded-md bg-blue-100 text-blue-800">${escapeHtml(s.code)}</span>
                  <h3 class="font-semibold text-slate-900 truncate">${escapeHtml(s.name)}</h3>
                </div>
                <p class="text-xs text-slate-500 mt-1 truncate">${escapeHtml(s.teacher)} &bull; ${s.students.length} students &bull; ${days} working days</p>
              </div>
              <svg class="w-5 h-5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </button>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="p-4 space-y-3">
${cards}
        </div>
      `;

      container.querySelectorAll('.sub-card').forEach((btn) => {
        btn.addEventListener('click', () => {
          const sub = db.subjects.find((x) => x.id === btn.dataset.subId);
          if (sub) promptSubjectPin(sub);
        });
      });
    }

    function promptSubjectPin(subject) {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">Unlock ${escapeHtml(subject.name)}</h2>
        <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(subject.code)} &bull; ${escapeHtml(subject.teacher)}</p>
        <form id="pin-form" class="mt-4 space-y-3">
          <input id="pin-input" type="password" maxlength="16" placeholder="Enter PIN or Password" autofocus class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="pin-error" class="hidden text-xs text-red-600 font-medium"></p>
          <div class="flex items-center justify-between pt-1">
            <button type="button" id="pin-forgot" class="px-2.5 py-1.5 bg-blue-50 rounded-lg text-xs font-semibold text-blue-700 hover:bg-blue-100">Forgot / Reset?</button>
            <div class="flex gap-2">
              <button type="button" id="pin-cancel" class="px-4 py-2 text-sm font-medium bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
              <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl hover:bg-blue-800">Unlock</button>
            </div>
          </div>
        </form>
      `);
      document.getElementById('pin-cancel').addEventListener('click', closeModal);
      document.getElementById('pin-forgot').addEventListener('click', () => {
        promptAdminResetForSubject(subject);
      });
      document.getElementById('pin-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('pin-input').value.trim();
        if (val === subject.pin) {
          closeModal();
          ui.activeSubjectId = subject.id;
          ui.screen = 'subject';
          ui.activeTab = 'mark';
          ui.selectedDate = todayISO();
          initDraftForDate(subject, ui.selectedDate);
          render();
        } else {
          const err = document.getElementById('pin-error');
          err.textContent = 'Incorrect PIN/password. Please try again.';
          err.classList.remove('hidden');
        }
      });
    }

    function promptAdminResetForSubject(subject) {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">Reset ${escapeHtml(subject.code)} Password</h2>
        <p class="text-xs text-slate-500 mt-0.5">Verify Admin PIN to set a new teacher PIN/password.</p>
        <form id="adm-rst-form" class="mt-4 space-y-3">
          <input id="adm-rst-admin" type="password" maxlength="16" placeholder="Enter Admin PIN" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm" />
          <input id="adm-rst-new" type="password" maxlength="16" placeholder="New Subject PIN / Password (4+ chars)" required class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm" />
          <p id="adm-rst-err" class="hidden text-xs text-red-600 font-medium"></p>
          <div class="flex justify-end gap-2">
            <button type="button" id="adm-rst-cancel" class="px-4 py-2 text-sm bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl">Reset</button>
          </div>
        </form>
      `);
      document.getElementById('adm-rst-cancel').addEventListener('click', closeModal);
      document.getElementById('adm-rst-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const adminVal = document.getElementById('adm-rst-admin').value.trim();
        const newPin = document.getElementById('adm-rst-new').value.trim();
        const err = document.getElementById('adm-rst-err');
        if (adminVal !== db.adminPin) {
          err.textContent = 'Invalid Admin PIN.';
          err.classList.remove('hidden');
          return;
        }
        if (newPin.length < 4) {
          err.textContent = 'New PIN/password must be at least 4 characters.';
          err.classList.remove('hidden');
          return;
        }
        subject.pin = newPin;
        saveState();
        closeModal();
        showToast(`Password reset for ${subject.code}`);
      });
    }

    function promptAdminPin() {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">Admin / HOD Access</h2>
        <p class="text-xs text-slate-500 mt-0.5">Manage subjects, codes, and reset passwords</p>
        <form id="admin-pin-form" class="mt-4 space-y-3">
          <input id="admin-pin-input" type="password" maxlength="16" placeholder="Enter Admin PIN" autofocus class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-base tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <p id="admin-pin-error" class="hidden text-xs text-red-600 font-medium"></p>
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" id="admin-pin-cancel" class="px-4 py-2 text-sm font-medium bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl hover:bg-blue-800">Enter</button>
          </div>
        </form>
      `);
      document.getElementById('admin-pin-cancel').addEventListener('click', closeModal);
      document.getElementById('admin-pin-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const val = document.getElementById('admin-pin-input').value.trim();
        if (val === db.adminPin) {
          closeModal();
          ui.screen = 'admin';
          render();
        } else {
          const err = document.getElementById('admin-pin-error');
          err.textContent = 'Invalid Admin PIN.';
          err.classList.remove('hidden');
        }
      });
    }

    // -----------------------------------------------------------------------
    // ADMIN SCREEN
    // -----------------------------------------------------------------------
    function renderAdmin(container) {
      const list = db.subjects
        .map(
          (s) => `
          <div class="p-3.5 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="font-semibold text-sm text-slate-900 truncate">${escapeHtml(s.name)} (${escapeHtml(s.code)})</div>
              <div class="text-xs text-slate-500 truncate">${escapeHtml(s.teacher)} &bull; PIN: <code>${escapeHtml(s.pin)}</code></div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" data-edit-id="${escapeHtml(s.id)}" class="btn-edit-sub px-2 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg">Edit</button>
              <button type="button" data-reset-id="${escapeHtml(s.id)}" class="btn-reset-pin px-2 py-1.5 text-xs font-medium bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-lg">Reset PIN</button>
              <button type="button" data-del-id="${escapeHtml(s.id)}" class="btn-del-sub px-2 py-1.5 text-xs font-medium bg-red-50 text-red-700 hover:bg-red-100 rounded-lg">Del</button>
            </div>
          </div>
        `
        )
        .join('');

      container.innerHTML = `
        <div class="p-4 space-y-4">

    function openAddSubjectModal(existing = null) {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">${existing ? 'Edit Subject & Code' : 'Add New Subject'}</h2>
        <form id="add-sub-form" class="mt-3 space-y-3">
          <input id="sub-code" type="text" value="${escapeHtml(existing ? existing.code : '')}" placeholder="Subject Code (e.g. BIO106)" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm uppercase" />
          <input id="sub-name" type="text" value="${escapeHtml(existing ? existing.name : '')}" placeholder="Subject Name (e.g. Biology)" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input id="sub-teacher" type="text" value="${escapeHtml(existing ? existing.teacher : '')}" placeholder="Teacher Name" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          ${
            existing
              ? ''
              : '<input id="sub-pin" type="password" maxlength="16" placeholder="Teacher PIN / Password (4+ chars)" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />'
          }
          <p id="sub-err" class="hidden text-xs text-red-600"></p>
          <div class="flex justify-end gap-2 pt-1">
            <button type="button" id="sub-cancel" class="px-4 py-2 text-sm bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl">${existing ? 'Save' : 'Create'}</button>
          </div>
        </form>
      `);
      document.getElementById('sub-cancel').addEventListener('click', closeModal);
      document.getElementById('add-sub-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const code = document.getElementById('sub-code').value.trim().toUpperCase();
        const name = document.getElementById('sub-name').value.trim();
        const teacher = document.getElementById('sub-teacher').value.trim();
        const err = document.getElementById('sub-err');

        const dupCode = db.subjects.some(
          (s) => s.code.toLowerCase() === code.toLowerCase() && (!existing || s.id !== existing.id)
        );
        if (dupCode) {
          err.textContent = `Subject code "${code}" already exists.`;
          err.classList.remove('hidden');
          return;
        }

        if (existing) {
          existing.code = code;
          existing.name = name;
          existing.teacher = teacher;
          saveState();
          closeModal();
          showToast('Subject updated');
          render();
        } else {
          const pin = document.getElementById('sub-pin').value.trim();
          if (pin.length < 4) {
            err.textContent = 'PIN/password must be at least 4 characters.';
            err.classList.remove('hidden');
            return;
          }
          db.subjects.push({
            id: 'sub_' + Date.now(),
            name,
            code,
            teacher,
            pin,
            students: [],
            sessions: {}
          });
          saveState();
          closeModal();
          showToast(`Added ${name} (${code})`);
          render();
        }
      });
    }

    // -----------------------------------------------------------------------
    // SUBJECT DASHBOARD
    // -----------------------------------------------------------------------
    function renderSubjectDashboard(container, sub) {
      const totalStudents = sub.students.length;
      const totalDays = Object.keys(sub.sessions || {}).length;
      const totals = computeStudentTotals(sub);
      const avgPct =
        totalStudents > 0 && totalDays > 0
          ? (totals.reduce((acc, s) => acc + s.pct, 0) / totalStudents).toFixed(1)
          : '—';

      const kpiHtml = `
        <div class="grid grid-cols-3 gap-2 px-4 pt-3 pb-2 bg-slate-50 border-b border-slate-200">
          <div class="bg-white p-2.5 rounded-xl border border-slate-200">
            <div class="text-[11px] text-slate-500">Students</div>
            <div class="text-lg font-bold text-slate-900">${totalStudents}</div>
          </div>
          <div class="bg-white p-2.5 rounded-xl border border-slate-200">
            <div class="text-[11px] text-slate-500">Working Days</div>
            <div class="text-lg font-bold text-slate-900">${totalDays}</div>
          </div>
          <div class="bg-white p-2.5 rounded-xl border border-slate-200">
            <div class="text-[11px] text-slate-500">Avg %</div>
            <div class="text-lg font-bold text-blue-700">${avgPct}${avgPct === '—' ? '' : '%'}</div>
          </div>
        </div>
        <div id="tab-body"></div>
      `;
      container.innerHTML = kpiHtml;
      const tabBody = document.getElementById('tab-body');

      if (ui.activeTab === 'mark') renderMarkTab(tabBody, sub, totals);
      else if (ui.activeTab === 'students') renderStudentsTab(tabBody, sub, totals, totalDays);
      else renderHistoryTab(tabBody, sub);
    }

    function renderMarkTab(container, sub, totals) {
      if (sub.students.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center">
            <p class="text-sm text-slate-600 mb-3">No students in this subject yet.</p>
            <button type="button" id="go-add-students" class="px-4 py-2 bg-blue-700 text-white text-sm font-semibold rounded-xl">
              Add Students First
            </button>
          </div>
        `;
        document.getElementById('go-add-students').addEventListener('click', () => {
          ui.activeTab = 'students';
          render();
        });
        return;
      }

      const q = ui.searchQuery.toLowerCase();
      const filtered = totals.filter(
        (st) => st.name.toLowerCase().includes(q) || st.regNo.toLowerCase().includes(q)
      );

      let presentCount = 0;
      let absentCount = 0;
      for (const st of sub.students) {
        if (ui.draftStatus[st.id] === 'absent') absentCount++;
        else presentCount++;
      }

      const rows = filtered
        .map((st) => {
          const isPresent = ui.draftStatus[st.id] !== 'absent';
          return `
            <button type="button" data-st-id="${escapeHtml(st.id)}" class="mark-row w-full text-left px-3.5 py-3 rounded-xl border ${
            isPresent ? 'border-emerald-200 bg-emerald-50/50' : 'border-red-200 bg-red-50/60'
          } flex items-center justify-between gap-3 transition">
              <div class="min-w-0">
                <div class="font-semibold text-sm text-slate-900 truncate">${escapeHtml(st.name)}</div>
                <div class="text-xs text-slate-500">Reg No: ${escapeHtml(st.regNo)}</div>
              </div>
              <span class="px-3 py-1 rounded-full text-xs font-bold shrink-0 ${
                isPresent ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
              }">
                ${isPresent ? 'PRESENT' : 'ABSENT'}
              </span>
            </button>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <input id="mark-date" type="date" value="${escapeHtml(ui.selectedDate)}" class="px-3 py-2 bg-white text-slate-900 border border-slate-300 rounded-xl text-sm font-medium" />
            <div class="flex gap-1.5">
              <button type="button" id="btn-all-p" class="px-2.5 py-2 text-xs font-semibold bg-emerald-100 text-emerald-800 rounded-xl">All P</button>
              <button type="button" id="btn-all-a" class="px-2.5 py-2 text-xs font-semibold bg-red-100 text-red-800 rounded-xl">All A</button>
            </div>
          </div>
          <input id="mark-search" type="search" value="${escapeHtml(ui.searchQuery)}" placeholder="Search by Name or Reg No..." class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm" />
          <div class="space-y-2">${rows}</div>
          <button type="button" id="btn-save-attendance" class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-xl shadow-sm text-sm">
            Save Attendance (${presentCount} P &bull; ${absentCount} A)
          </button>
        </div>
      `;

      document.getElementById('mark-date').addEventListener('change', (e) => {
        ui.selectedDate = e.target.value || todayISO();
        initDraftForDate(sub, ui.selectedDate);
        render();
      });
      document.getElementById('btn-all-p').addEventListener('click', () => {
        for (const st of sub.students) ui.draftStatus[st.id] = 'present';
        render();
      });
      document.getElementById('btn-all-a').addEventListener('click', () => {
        for (const st of sub.students) ui.draftStatus[st.id] = 'absent';
        render();
      });
      const searchEl = document.getElementById('mark-search');
      searchEl.addEventListener('input', (e) => {
        ui.searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const el = document.getElementById('mark-search');
        if (el) {
          el.focus();
          el.setSelectionRange(pos, pos);
        }
      });

      container.querySelectorAll('.mark-row').forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.stId;
          ui.draftStatus[id] = ui.draftStatus[id] === 'absent' ? 'present' : 'absent';
          render();
        });
      });

      document.getElementById('btn-save-attendance').addEventListener('click', () => {
        if (!sub.sessions) sub.sessions = {};
        sub.sessions[ui.selectedDate] = { ...ui.draftStatus };
        saveState();
        showToast(`Saved attendance for ${ui.selectedDate}`);
        render();
      });
    }

    function renderStudentsTab(container, sub, totals, totalDays) {
      const q = ui.searchQuery.toLowerCase();
      const filtered = totals.filter(
        (st) => st.name.toLowerCase().includes(q) || st.regNo.toLowerCase().includes(q)
      );

      const rows = filtered
        .map((st) => {
          const low = totalDays > 0 && st.pct < 75;
          return `
            <div class="p-3.5 rounded-xl border border-slate-200 bg-white flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-sm text-slate-900 truncate">${escapeHtml(st.name)}</span>
                  ${low ? '<span class="px-2 py-0.5 text-[10px] font-bold bg-red-100 text-red-700 rounded-full">Low &lt;75%</span>' : ''}
                </div>
                <div class="text-xs text-slate-500 mt-0.5">
                  Reg: ${escapeHtml(st.regNo)} &bull; P: <strong>${st.present}</strong> &bull; A: <strong>${st.absent}</strong> &bull; <strong>${st.pct.toFixed(1)}%</strong>
                </div>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" data-edit-st="${escapeHtml(st.id)}" class="btn-edit-st px-2.5 py-1.5 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg font-medium">Edit</button>
                <button type="button" data-del-st="${escapeHtml(st.id)}" class="btn-del-st px-2.5 py-1.5 text-xs bg-red-50 text-red-700 hover:bg-red-100 rounded-lg font-medium">Del</button>
              </div>
            </div>
          `;
        })
        .join('');

      container.innerHTML = `
        <div class="p-4 space-y-3">
          <div class="flex gap-2">
            <button type="button" id="btn-add-student" class="flex-1 py-2.5 px-3 bg-blue-700 hover:bg-blue-800 text-white text-sm font-semibold rounded-xl">
              + Add Student
            </button>
            <button type="button" id="btn-bulk-import" class="py-2.5 px-3 bg-slate-100 hover:bg-slate-200 text-slate-800 text-sm font-semibold rounded-xl">
              Bulk Import
            </button>
          </div>
          <input id="st-search" type="search" value="${escapeHtml(ui.searchQuery)}" placeholder="Filter by Name or Reg No..." class="w-full px-3.5 py-2 border border-slate-300 rounded-xl text-sm" />
          <div class="space-y-2">${rows || '<p class="text-sm text-slate-500 text-center py-6">No matching students.</p>'}</div>
        </div>
      `;

      document.getElementById('btn-add-student').addEventListener('click', () => openStudentModal(sub, null));
      document.getElementById('btn-bulk-import').addEventListener('click', () => openBulkImportModal(sub));

      const searchEl = document.getElementById('st-search');
      searchEl.addEventListener('input', (e) => {
        ui.searchQuery = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const el = document.getElementById('st-search');
        if (el) {
          el.focus();
          el.setSelectionRange(pos, pos);
        }
      });

      container.querySelectorAll('.btn-edit-st').forEach((b) => {
        b.addEventListener('click', () => {
          const st = sub.students.find((x) => x.id === b.dataset.editSt);
          if (st) openStudentModal(sub, st);
        });
      });

      container.querySelectorAll('.btn-del-st').forEach((b) => {
        b.addEventListener('click', () => {
          const id = b.dataset.delSt;
          sub.students = sub.students.filter((x) => x.id !== id);
          for (const dt of Object.keys(sub.sessions || {})) {
            delete sub.sessions[dt][id];
          }
          delete ui.draftStatus[id];
          saveState();
          showToast('Student removed');
          render();
        });
      });
    }

    function openStudentModal(sub, existing) {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">${existing ? 'Edit Student' : 'Add Student'}</h2>
        <form id="st-form" class="mt-3 space-y-3">
          <input id="st-reg" type="text" value="${escapeHtml(existing ? existing.regNo : '')}" placeholder="Registration No (e.g. 105)" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <input id="st-name" type="text" value="${escapeHtml(existing ? existing.name : '')}" placeholder="Student Full Name" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm" />
          <p id="st-err" class="hidden text-xs text-red-600"></p>
          <div class="flex justify-end gap-2">
            <button type="button" id="st-cancel" class="px-4 py-2 text-sm bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl">Save</button>
          </div>
        </form>
      `);
      document.getElementById('st-cancel').addEventListener('click', closeModal);
      document.getElementById('st-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const regNo = document.getElementById('st-reg').value.trim();
        const name = document.getElementById('st-name').value.trim();
        const dup = sub.students.some(
          (s) => s.regNo.toLowerCase() === regNo.toLowerCase() && (!existing || s.id !== existing.id)
        );
        if (dup) {
          const err = document.getElementById('st-err');
          err.textContent = 'Registration No already exists in this subject.';
          err.classList.remove('hidden');
          return;
        }
        if (existing) {
          existing.regNo = regNo;
          existing.name = name;
        } else {
          const newId = 'st_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
          sub.students.push({ id: newId, regNo, name });
          ui.draftStatus[newId] = 'present';
        }
        saveState();
        closeModal();
        showToast(existing ? 'Student updated' : 'Student added');
        render();
      });
    }

    function openBulkImportModal(sub) {
      openModal(`
        <h2 class="text-lg font-bold text-slate-900">Bulk Import Students</h2>
        <p class="text-xs text-slate-500 mt-0.5">Paste one student per line as: <code>RegNo, Name</code></p>
        <form id="bulk-form" class="mt-3 space-y-3">
          <textarea id="bulk-text" rows="6" placeholder="105, Priya Nair&#10;106, Rahul Verma" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-mono"></textarea>
          <div class="flex justify-end gap-2">
            <button type="button" id="bulk-cancel" class="px-4 py-2 text-sm bg-slate-100 text-slate-800 rounded-xl hover:bg-slate-200">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-blue-700 rounded-xl">Import</button>
          </div>
        </form>
      `);
      document.getElementById('bulk-cancel').addEventListener('click', closeModal);
      document.getElementById('bulk-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const lines = document.getElementById('bulk-text').value.split('\n');
        let added = 0;
        for (const line of lines) {
          const parts = line.split(',');
          if (parts.length >= 2) {
            const regNo = parts[0].trim();
            const name = parts.slice(1).join(',').trim();
            if (regNo && name && !sub.students.some((s) => s.regNo.toLowerCase() === regNo.toLowerCase())) {
              const newId = 'st_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
              sub.students.push({ id: newId, regNo, name });
              ui.draftStatus[newId] = 'present';
              added++;
            }
          }
        }
        saveState();
        closeModal();
        showToast(`Imported ${added} students`);
        render();
      });
    }

    function renderHistoryTab(container, sub) {
      const dates = Object.keys(sub.sessions || {}).sort((a, b) => b.localeCompare(a));
      if (dates.length === 0) {
        container.innerHTML = `<p class="p-8 text-center text-sm text-slate-500">No attendance sessions recorded yet.</p>`;
        return;
      }

      const rows = dates
        .map((dt) => {
          const rec = sub.sessions[dt];
          const vals = Object.values(rec);
          const p = vals.filter((v) => v === 'present').length;
          const a = vals.filter((v) => v === 'absent').length;
          return `
            <div class="p-3.5 rounded-xl border border-slate-200 bg-white flex items-center justify-between gap-2">
              <button type="button" data-open-date="${escapeHtml(dt)}" class="btn-open-date bg-white text-slate-900 text-left flex-1 min-w-0">
                <div class="font-semibold text-sm text-slate-900">${escapeHtml(dt)}</div>
                <div class="text-xs text-slate-500 mt-0.5">Present: <strong class="text-emerald-700">${p}</strong> &bull; Absent: <strong class="text-red-700">${a}</strong></div>
              </button>
              <button type="button" data-del-date="${escapeHtml(dt)}" class="btn-del-date px-2.5 py-1.5 text-xs bg-red-50 text-red-700 hover:bg-red-100 rounded-lg font-medium shrink-0">Delete</button>
            </div>
          `;
        })
        .join('');

      container.innerHTML = `<div class="p-4 space-y-2.5">${rows}</div>`;

      container.querySelectorAll('.btn-open-date').forEach((b) => {
        b.addEventListener('click', () => {
          ui.selectedDate = b.dataset.openDate;
          initDraftForDate(sub, ui.selectedDate);
          ui.activeTab = 'mark';
          render();
        });
      });

      container.querySelectorAll('.btn-del-date').forEach((b) => {
        b.addEventListener('click', () => {
          delete sub.sessions[b.dataset.delDate];
          saveState();
          showToast(`Deleted session ${b.dataset.delDate}`);
          render();
        });
      });
    }

    function exportCsv(sub) {
      const totals = computeStudentTotals(sub);
      const totalDays = Object.keys(sub.sessions || {}).length;
      const lines = ['Reg No,Student Name,Total Present,Total Absent,Total Working Days,Attendance %'];
      for (const st of totals) {
        const reg = `"${st.regNo.replace(/"/g, '""')}"`;
        const name = `"${st.name.replace(/"/g, '""')}"`;
        lines.push(`${reg},${name},${st.present},${st.absent},${totalDays},${st.pct.toFixed(1)}%`);
      }
      const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${sub.code.replace(/[^a-zA-Z0-9_-]/g, '_')}_attendance.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('CSV downloaded');
    }

    render();
  </script>
</body>
</html>
